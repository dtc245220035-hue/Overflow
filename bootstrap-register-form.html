<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký với Bootstrap Forms</title>
    <!-- Nhúng Bootstrap CSS từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        /* Tùy chỉnh để form trông chuyên nghiệp hơn */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 700px;
            border-top: 5px solid #0d6efd;
        }

        .register-card h2 {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-submit {
            font-weight: 600;
            padding: 12px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        }
    </style>
</head>
<body>

    <div class="register-card">
        <!-- Tiêu đề Form -->
        <div class="text-center mb-4">
            <h2>Đăng Ký Tài Khoản</h2>
            <p class="text-muted">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới.</p>
        </div>

        <!-- Form Đăng Ký -->
        <form action="#" method="POST">
            
            <!-- Họ và Tên & Email (Chia 2 cột trên Desktop) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="fullname" class="form-label">Họ và Tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên..." required>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                </div>
            </div>

            <!-- Mật khẩu & Xác nhận mật khẩu (Chia 2 cột trên Desktop) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu..." required>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="confirm_password" class="form-label">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirm_password" placeholder="Nhập lại mật khẩu..." required>
                </div>
            </div>

            <!-- Giới tính (Radio Button) -->
            <div class="mb-3">
                <label class="form-label d-block">Giới tính</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                    <label class="form-check-input-label" for="male">Nam</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                    <label class="form-check-input-label" for="female">Nữ</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                    <label class="form-check-input-label" for="other">Khác</label>
                </div>
            </div>

            <!-- Sở thích (Checkbox) -->
            <div class="mb-3">
                <label class="form-label d-block">Sở thích</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="reading" value="reading">
                    <label class="form-check-input-label" for="reading">Đọc sách</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="travel" value="travel">
                    <label class="form-check-input-label" for="travel">Du lịch</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="music" value="music">
                    <label class="form-check-input-label" for="music">Âm nhạc</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="sports" value="sports">
                    <label class="form-check-input-label" for="sports">Thể thao</label>
                </div>
            </div>

            <!-- Quốc gia (Dropdown Select) -->
            <div class="mb-4">
                <label for="country" class="form-label">Quốc gia</label>
                <select class="form-select" id="country">
                    <option selected disabled>-- Chọn quốc gia --</option>
                    <option value="vn">Việt Nam</option>
                    <option value="us">Hoa Kỳ</option>
                    <option value="uk">Anh</option>
                    <option value="jp">Nhật Bản</option>
                    <option value="kr">Hàn Quốc</option>
                    <option value="other">Khác</option>
                </select>
            </div>

            <!-- Nút Submit -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-submit">Đăng Ký Ngay</button>
            </div>

            <!-- Dòng điều khoản -->
            <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.9rem;">
                Bằng việc đăng ký, bạn đồng ý với <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a> của chúng tôi.
            </p>

        </form>
    </div>

    <!-- Nhúng Bootstrap JS từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
