<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Responsive Image Gallery</h2>

    <div class="gallery">
        <div class="responsive">
            <div class="item">
                <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="Cinque Terre">
                <p>Add a description of the image here</p>
            </div>
        </div>
        <div class="responsive">
            <div class="item">
                <img src="https://www.w3schools.com/css/img_forest.jpg" alt="Forest">
                <p>Add a description of the image here</p>
            </div>
        </div>
        <div class="responsive">
            <div class="item">
                <img src="https://www.w3schools.com/css/img_lights.jpg" alt="Northern Lights">
                <p>Add a description of the image here</p>
            </div>
        </div>
        <div class="responsive">
            <div class="item">
                <img src="https://www.w3schools.com/css/img_mountains.jpg" alt="Mountains">
                <p>Add a description of the image here</p>
            </div>
        </div>
    </div>
</body>
</html>
